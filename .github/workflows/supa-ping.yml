name: Supabase Ping

on:
  schedule:
    - cron: '41 9 * * 1,3,5'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  supabase-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase Health Check
        run: |
          # GET /auth/v1/health — endpoint de health check do GoTrue, aceita anon key
          response=$(curl -s -w "%{http_code}" \
                -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
                "https://qcriykfyryaubdjdcgeo.supabase.co/auth/v1/health" \
                -o /tmp/response.json)

          echo "Health check response: $response"

          if [[ "$response" =~ ^2[0-9][0-9]$ ]]; then
            echo "Supabase is healthy"
            cat /tmp/response.json
          else
            echo "Supabase health check failed with status code $response"
            cat /tmp/response.json
            exit 1
          fi

      - name: test Users table Acess
        run: |
          # Tenta acessar a tabela users especificamente, com retry para blips transitorios
          success=false
          for attempt in 1 2 3; do
            response=$(curl -s -w "%{http_code}" --max-time 30 \
                    -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
                    -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
                    "https://qcriykfyryaubdjdcgeo.supabase.co/rest/v1/users?select=count" \
                    -o /tmp/users_response.json)
            echo "Attempt $attempt: users table response $response"
            if [[ "$response" == "200" ]]; then
              success=true
              break
            fi
            sleep 15
          done
          cat /tmp/users_response.json

          if [ "$success" = "true" ]; then
            echo "Users table is accessible"
          else
            echo "Users table access failed after 3 attempts"
            exit 1
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Supabase ping falhou - projeto pode pausar"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          BODY="O workflow supa-ping falhou em $(date -u +%Y-%m-%dT%H:%M:%SZ). Verifique se o Supabase deste projeto ainda responde antes que ele pause por inatividade. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
