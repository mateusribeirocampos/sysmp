name: Supabase Ping

on:
  schedule:
    # Four real database reads/day; Free plan pausing is not a resettable timer.
    - cron: '41 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      notify_on_failure:
        description: Create or comment on a failure issue
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  supabase-ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify Supabase database monitoring row
        env:
          SUPABASE_PROJECT_REF: qcriykfyryaubdjdcgeo
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash .github/scripts/supabase-ping.sh
      - name: Alert on failure
        if: ${{ failure() && (github.event_name != 'workflow_dispatch' || inputs.notify_on_failure) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Supabase ping falhou - projeto pode pausar"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          BODY="O workflow supa-ping falhou em $(date -u +%Y-%m-%dT%H:%M:%SZ). Verifique se o Supabase deste projeto ainda responde antes que ele pause por inatividade. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
